name: Build and push bufr-monitor dev image
 
on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/build-dev-image.yaml"
  workflow_dispatch: {}   # manual rebuild button
 
env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/bufr-monitor-dev
 
permissions:
  contents: read
  packages: write   # needed to push to GHCR
 
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
 
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: Smoke test -- confirm the key imports actually work
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:latest python -c "
          import bufr
          import emcpy
          import wxflow
          import xarray
          import matplotlib
          import cartopy
          print('bufr:', bufr.__file__)
          print('emcpy:', emcpy.__file__)
          print('wxflow:', wxflow.__file__)
          print('all imports OK')
          "
