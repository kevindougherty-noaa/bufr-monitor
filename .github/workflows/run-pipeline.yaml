name: Run CrIS pipeline and publish to Pages

on:
  workflow_dispatch: {}   # manual for now; add `schedule:` once this is proven reliable

permissions:
  contents: read
  packages: read    # needed to pull the (likely private) GHCR image below
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    container:
      # env context isn't available here -- github context is, so
      # inline the image name directly rather than referencing env.
      image: ghcr.io/${{ github.repository_owner }}/bufr-monitor-dev:latest
      # The Dockerfile's default USER (developer, non-root) is right
      # for local dev, but breaks GitHub Actions' own internal file
      # commands (e.g. checkout's post-job save-state), which need to
      # write into /__w/_temp -- a host-mounted path expecting root.
      # Override just for CI rather than changing the image itself.
      options: --user root
      # container image pulls happen before any step runs, so auth has
      # to live here rather than in a docker/login-action step.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install bufr-monitor (editable)
        run: pip install -e .

      - name: Run pipeline for latest available cycle
        run: python scripts/run_cycle.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
