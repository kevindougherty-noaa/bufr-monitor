# Trimmed variant of radiance_cris-fsr.yaml for the coverage-map-only CI
# step. The only things removed, relative to the vendored SPOC original:
#   - variables: sensorChannelNumber (*/CRCHNM/CHNM), spectralRadiance (*/CRCHNM/SRAD)
#   - encoder.variables: MetaData/sensorChannelNumber, ObsValue/spectralRadiance
#   - encoder.dimensions: the Channel dimension (nothing left needs it)
# These are the only fields under the repeated */CRCHNM group (2211
# channels), so this removes the entire expensive nested-group parse --
# not just the largest array, but the whole per-obs 2211-wide iteration.
# Everything else (lat/lon, angles, IDs, satId split, cloud fields) is a
# cheap per-obs scalar and is unchanged from the original.
bufr:
  variables:
    # MetaData
    timestamp:
      datetime:
        year: "*/YEAR"
        month: "*/MNTH"
        day: "*/DAYS"
        hour: "*/HOUR"
        minute: "*/MINU"
        second: "*/SECO"

    latitude:
      query: "*/CLATH"

    longitude:
      query: "*/CLONH"

    satelliteId:
      query: "*/SAID"

    sensorId:
      query: "*/SIID[1]"

    scanLineNumber:
      query: "*/SLNM"

    fieldOfViewNumber:
      query: "*/FOVN"

    fieldOfRegardNumber:
      query: "*/FORN"

    sensorScanPosition:
      query: "*/FOVN"

    solarZenithAngle:
      query: "*/SOZA"

    solarAzimuthAngle:
      query: "*/SOLAZI"

    sensorZenithAngle:
      query: "*/SAZA"

    sensorAzimuthAngle:
      query: "*/BEARAZ"

    sensorViewAngle:
      sensorScanAngle:
        fieldOfViewNumber: "*/FOVN"
        fieldOfRegardNumber: "*/FORN"
        scanStart: -48.330
        scanStep: 3.3331
        sensor: cris

    # ObsValue
    cloudCoverTotal:
      query: "*/TOCC"
      type: float
      transforms:
        - scale: 0.01

    cloudTopHeight:
      query: "*/HOCT"
      type: float

  splits:
    satId:
      category:
        variable: satelliteId
        map:
          _224: npp
          _225: n20
          _226: n21

encoder:
  globals:
    - name: "description"
      type: string
      value: "Level-1C CrIS geolocation and metadata only (spectralRadiance omitted -- coverage-map variant)"

    - name: "platformCommonName"
      type: string
      value: "JPSS"

    - name: "platformLongDescription"
      type: string
      value: "NOAA Joint Polar Satellite System"

    - name: "sensorCommonName"
      type: string
      value: "CrIS"

    - name: "sensorLongDescription"
      type: string
      value: "Cross-track Infrared Sounder (Interferometer) with three IR bands with 2211 channels; cross-track scanning"

    - name: "source"
      type: string
      value: "U.S. National Weather Service, National Centres for Environmental Prediction (NCEP))"

    - name: "sourceFiles"
      type: string
      value: "NCEP BUFR Dump - crisf4 NC021206 Normal Feed 431 channel subset"

    - name: "processingLevel"
      type: string
      value: "Level-1C"

    - name: "converter"
      type: string
      value: "bufr-query"

  variables:

    # MetaData
    - name: "MetaData/dateTime"
      source: variables/timestamp
      longName: "Datetime"
      units: "seconds since 1970-01-01T00:00:00Z"

    - name: "MetaData/latitude"
      source: variables/latitude
      longName: "Latitude"
      units: "degrees_north"
      range: [ -90, 90 ]

    - name: "MetaData/longitude"
      source: variables/longitude
      longName: "Longitude"
      units: "degrees_east"
      range: [ -180, 180 ]

    - name: "MetaData/satelliteIdentifier"
      source: variables/satelliteId
      longName: "Satellite Identifier"

    - name: "MetaData/scanLineNumber"
      source: variables/scanLineNumber
      longName: "Scan Line Number"

    - name: "MetaData/fieldOfViewNumber"
      source: variables/fieldOfViewNumber
      longName: "Field of View Number"

    - name: "MetaData/fieldOfRegardNumber"
      source: variables/fieldOfRegardNumber
      longName: "Field of Regard Number"

    - name: "MetaData/sensorScanPosition"
      source: variables/sensorScanPosition
      longName: "Sensor Scan Position"

    - name: "MetaData/solarZenithAngle"
      source: variables/solarZenithAngle
      longName: "Solar Zenith Angle"
      units: "degree"
      range: [ 0, 180 ]

    - name: "MetaData/solarAzimuthAngle"
      source: variables/solarAzimuthAngle
      longName: "Solar Azimuth Angle"
      units: "degree"
      range: [ 0, 360 ]

    - name: "MetaData/sensorZenithAngle"
      source: variables/sensorZenithAngle
      longName: "Sensor Zenith Angle"
      units: "degree"
      range: [ 0, 90 ]

    - name: "MetaData/sensorAzimuthAngle"
      source: variables/sensorAzimuthAngle
      longName: "Sensor Azimuth Angle"
      units: "degree"
      range: [ 0, 360 ]

    - name: "MetaData/sensorViewAngle"
      source: variables/sensorViewAngle
      longName: "Sensor View Angle"
      units: "degree"

    - name: "ObsValue/cloudCoverTotal"
      source: variables/cloudCoverTotal
      longName: "Total Cloud Cover"
      units: "1"
      range: [ 0, 1 ]

    - name: "ObsValue/heightOfTopOfCloud"
      source: variables/cloudTopHeight
      longName: "Height of Top of Cloud"
      units: "m"